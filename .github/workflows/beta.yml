name: Beta APK

# A beta of the mobile app for Android testers, without any store or
# account: an APK built here, signed with the beta key (repository secrets),
# published as a GitHub pre-release. Run by hand (Actions > Beta APK).
# The same key signs every beta, so testers update without losing their
# data; how to install it is in apps/mobile/BETA.md.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app (release, phone architectures)
        working-directory: apps/mobile
        run: |
          node scripts/bible.mjs
          npx expo prebuild --platform android --no-install
          # Each beta is newer than the last for Android: its run number.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign with the beta key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beta.p12"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/beta.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "bible-plan-$version-beta.${{ github.run_number }}.apk" \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "bible-plan-$version-beta.${{ github.run_number }}.apk"
          rm "$RUNNER_TEMP/beta.p12"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mobile-v$VERSION-beta.${{ github.run_number }}"
          gh release create "$tag" "bible-plan-$VERSION-beta.${{ github.run_number }}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bible Plan $VERSION beta ${{ github.run_number }} (Android)" \
            --notes "Bêta de l'application Android, sans compte. Pour l'installer : https://github.com/${{ github.repository }}/blob/main/apps/mobile/BETA.md"
